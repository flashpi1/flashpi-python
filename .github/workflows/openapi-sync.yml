name: OpenAPI sync

# Every day, downloads the public OpenAPI document of the Flashpi API
# (https://flashpi.com.ec/docs/openapi.json), regenerates src/flashpi/types/_generated.py and,
# when something changed, checks the SDK still passes its checks, then opens (or updates) a pull
# request with the change.
#
# Two jobs, so the GitHub App's key never shares a runner with dependency code:
# - sync installs the dependencies, regenerates the contract and runs the checks, with no
#   secret and a read-only GITHUB_TOKEN. It hands the two contract files over as an artifact.
# - pull-request runs no repository or dependency code: it copies those two files into a fresh
#   checkout and pushes and opens the PR with a token of the organization's GitHub App (the
#   FLASHPI_BOT_CLIENT_ID variable and FLASHPI_BOT_PRIVATE_KEY secret). A PR opened with the
#   App's token gets CI like any other; one opened with GITHUB_TOKEN would wait for approval.
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync the API contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      checks: ${{ steps.checks.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked

      - name: Download the document and regenerate the types
        run: uv run --no-sync python scripts/openapi.py sync

      - name: Look for changes
        id: diff
        run: |
          if git diff --quiet -- openapi src/flashpi/types/_generated.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- openapi src/flashpi/types/_generated.py
          fi

      - name: Check the SDK with the new contract
        id: checks
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .
          uv run --no-sync pyright
          uv run --no-sync pytest
          uv build --no-sources

      - name: Hand the new contract over
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract
          path: |
            openapi/openapi.json
            src/flashpi/types/_generated.py
          retention-days: 1

  pull-request:
    name: Open the pull request
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BRANCH: chore/openapi-sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Outside the checkout, so nothing in the artifact can land in .git or next to the files.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contract
          path: ${{ runner.temp }}/contract

      - name: Take the two contract files, and nothing else
        env:
          CONTRACT: ${{ runner.temp }}/contract
        run: |
          for file in openapi/openapi.json src/flashpi/types/_generated.py; do
            if [ -L "$CONTRACT/$file" ] || [ ! -f "$CONTRACT/$file" ]; then
              echo "::error::The artifact has no regular file $file"
              exit 1
            fi
            cp "$CONTRACT/$file" "$file"
          done
          git diff --stat -- openapi/openapi.json src/flashpi/types/_generated.py

      # A one-hour token for this repository only: push the branch (contents) and open or edit
      # the PR (pull requests). It is revoked when the job ends.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FLASHPI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLASHPI_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
          CHECKS: ${{ needs.sync.outputs.checks }}
        run: |
          bot_id=$(gh api "/users/${BOT}" --jq .id)
          git config user.name "$BOT"
          git config user.email "${bot_id}+${BOT}@users.noreply.github.com"
          git -c core.hooksPath=/dev/null switch -C "$BRANCH"
          git add openapi/openapi.json src/flashpi/types/_generated.py
          git -c core.hooksPath=/dev/null commit -m "chore: sync the Flashpi API contract"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push --force "https://github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          if [ "$CHECKS" = success ]; then
            result="Formatting, lint, pyright, tests and build passed with the new contract."
          else
            result="Formatting, lint, pyright, tests or build FAILED with the new contract: see the workflow run. The SDK needs changes before this can merge."
          fi
          body="The public OpenAPI document of the Flashpi API changed. This updates openapi/openapi.json and the generated types.

          ${result}

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Review new operations or fields: they may need a method (tests/test_operations.py lists every operation) or a hand-written type in src/flashpi/."
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body "$body"
          else
            gh pr create --head "$BRANCH" --title "chore: sync the Flashpi API contract" --body "$body"
          fi
