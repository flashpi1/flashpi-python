[project]
name = "flashpi"
version = "0.0.0"
description = "The official Python SDK for Flashpi, the electronic invoicing API for Ecuador's SRI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SIGNIADIGITAL S.A." }]
keywords = ["flashpi", "sri", "ecuador", "facturacion electronica", "e-invoicing", "invoices", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Framework :: AsyncIO",
  "Typing :: Typed",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://flashpi.com.ec"
Documentation = "https://flashpi.com.ec/docs/sdks/"
Repository = "https://github.com/flashpi1/flashpi-python"
Issues = "https://github.com/flashpi1/flashpi-python/issues"
Changelog = "https://github.com/flashpi1/flashpi-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=9.2", "pytest-cov>=7.1", "pyright>=1.1.414", "ruff>=0.17.5"]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flashpi"]

[tool.hatch.build.targets.sdist]
include = ["src/flashpi", "tests", "README.md", "README.en.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "S", "N", "ANN", "TID", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR"]
"scripts/**" = ["S", "T20"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
